name: 큰사람 포인트 공지 수집

on:
  schedule:
    - cron: "7 */3 * * *"   # 3시간마다 (UTC 기준, 정각 혼잡을 피해 7분)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공지 수집
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/fetch_notices.py
      - name: 변경사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/notices.json
          git diff --cached --quiet || git commit -m "공지 업데이트 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push
